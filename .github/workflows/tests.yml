name: tests

# Three platforms, because portability is the claim this repo makes.
#
# A single-platform run would be actively misleading here: the whole argument is
# that a hook which assumes one platform does not error on the others, it
# no-ops quietly. Testing on one platform would reproduce that failure at the CI
# layer — a green badge that proves the suite ran somewhere, which is exactly the
# kind of evidence this repository argues against accepting.
#
# The Windows leg runs under Git Bash (shell: bash on windows-latest), which is
# the environment several of these findings came from: the App-Execution-Alias
# python3 stub, the GNU grep 3.0 `-i -F` abort, and the `mktemp -d` path form.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hooks:
    name: hooks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      # Belt and braces, and honestly labelled as such: this step fixed nothing.
      #
      # It was added on a wrong diagnosis, which is worth recording because the
      # wrong diagnosis was extremely plausible. The first CI run failed two of
      # three legs — Windows on the CRLF check, macOS on `bash -n` — and "the
      # checkout is rewriting line endings" explains both at once. It is the
      # textbook cause, and setting autocrlf before checkout is the textbook fix.
      #
      # It changed nothing, because there were two INDEPENDENT causes and neither
      # was line-ending conversion:
      #
      #   Windows — the CRLF check itself was a false positive. See the step
      #             below.
      #   macOS   — a heredoc nested inside `$( )`, which stock bash 3.2 cannot
      #             parse. A real portability bug in a hook, and the reason this
      #             matrix has a macOS leg at all.
      #
      # The lesson generalises past this file: one explanation covering every
      # symptom is evidence, not proof, and it is most seductive exactly when
      # several failures appear at once. What settled it was that the ubuntu leg
      # PASSED — a genuine conversion would not have spared it.
      #
      # Kept because it is free and makes the intent explicit, not because it is
      # load-bearing. Removing it should not change any result.
      - name: Prevent the checkout from rewriting line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The suite builds throwaway git repos and commits into them, so it needs
      # an identity. Without this, git refuses the commit and every fixture-based
      # case fails for a reason unrelated to what it is testing.
      - name: Configure git identity for fixtures
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name  "CI"
          git config --global init.defaultBranch main

      - name: Verify all scripts parse
        run: |
          rc=0
          for f in hooks/*.sh lib/*.sh tests/*.sh tests/lib/*.sh; do
            bash -n "$f" || { echo "PARSE FAIL: $f"; rc=1; }
          done
          exit $rc

      # Guards the LF requirement in .gitattributes. A CRLF script fails on macOS
      # and Linux with `bad interpreter: ...^M`, and checking it here means the
      # failure lands on whoever introduced it rather than whoever clones next.
      #
      # Deliberately NOT `grep -rlU $'\r' ...`, which is what this step used to
      # be. On the Windows leg that reported EVERY file in the repository as
      # containing a carriage return, on a tree with none. Reproduced locally
      # against a fresh clone and pinned down: `-l` lists a file as matching
      # while `-n` on the same file finds no matching line, so the flag is
      # provably lying. It misbehaves only on the RECURSIVE form — the identical
      # pattern against an explicit file list is correct and does detect a
      # genuinely planted CR. GNU grep 3.0 as shipped with Git for Windows, the
      # same build that aborts outright on `-i -F` combined.
      #
      # A guard that fires on a clean tree is not a stricter guard. It is the
      # mirror image of one that never fires: both are uninformative, and this
      # one additionally teaches you to ignore it. Read the bytes instead — and
      # note the empty-file-list check, so that a glob which stops matching
      # cannot turn this into a step that passes by scanning nothing.
      - name: Reject CRLF in scripts
        run: |
          python - <<'EOF'
          import glob, io, sys
          pats = ('hooks/*.sh', 'lib/*.sh', 'lib/*.py', 'tests/*.sh',
                  'tests/lib/*.sh', 'tools/*.py')
          files = sorted(f for p in pats for f in glob.glob(p))
          if not files:
              sys.exit("no scripts matched -- the check would pass vacuously")
          bad = [f for f in files if b'\r' in io.open(f, 'rb').read()]
          print("scanned %d file(s)" % len(files))
          if bad:
              print("CRLF line endings found:")
              for f in bad:
                  print("  " + f)
              sys.exit(1)
          print("all LF")
          EOF

      - name: closing-refs self-test
        run: python tools/closing-refs.py --self-test

      - name: Run hook test suite
        run: bash tests/run-all.sh
